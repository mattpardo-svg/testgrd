# RAO pipeline configuration.
#
# This file has NO fallback — run_pipeline.py will refuse to start if it's
# missing. Keep config/rao_config.default.yaml as an untouched copy of
# these exact values; if a change here ever causes a failure or
# non-convergence, restore from that file to get back to a state that's
# been validated throughout this project's development.
#
# ACTIVATE_CRA_XNE_LINKAGE is deliberately NOT included here — it is not
# a finished, safe-to-toggle feature yet (needs additional ae_path=
# wiring before it's safe to enable). It stays hardcoded in
# run_pipeline.py until that wiring is done.

workflow_toggles:
  # Calculation mode.
  #   ac_iterative: AC load flow, sensitivities recomputed in the linearisation and
  #                 completeness loops until they converge (the workflow of the functional spec).
  #   ac_single_pass: AC load flow, N-X analysis and sensitivities once at the initial state, one
  #                 MILP build and solve, one AC check of the result. The iteration caps and
  #                 thresholds below are ignored in this mode.
  #   dc: DC load flow, DC N-X security analysis and DC sensitivities (active power, converted to
  #       amperes with dc_power_factor of load_flow_config.yaml and dc_mode below), one MILP build and
  #       solve, one applied solution, one final AC check that only reports. No initial AC load flow.
  #       The iteration caps and thresholds below are ignored in this mode.
  calculation_mode: ac_iterative

  # Remedial action types the optimisation may use: a non-empty list with values from
  # pst (phase-shifting transformers), rd (redispatch), hvdc (HVDC set points, docs/specs/hvdc_ra_specs.md)
  # and countertrade (docs/specs/countertrade_ra_specs.md),
  # no duplicates. A type that is
  # not listed is not parsed, gets no sensitivities, no MILP block and no output file.
  # countertrade (docs/specs/countertrade_ra_specs.md) needs the two penalty_reference_ct_* keys below.
  # hvdc needs the two penalty_reference_hvdc_* keys below.
  ra_types: [pst, rd]

  # Whether N-X (post-contingency security) analysis runs at all. False
  # means only N-0 (base case) is analyzed. This is a pure addition —
  # every existing N-0-only run is unaffected by this being false.
  enable_nx_analysis: false

  # How the assessed elements are combined with the contingencies (N-X monitoring, N-X constraints, curative RA
  # availability).
  #   standard: as the NCP profile says: isCombinableWithContingency=false restricts an element to the contingencies
  #             with a link of kind included; links of kind included/excluded restrict/exclude per contingency.
  #   all_contingencies: every assessed element is combined with all must-study contingencies, as if
  #             isCombinableWithContingency were true and without the links of kind included; links of kind excluded
  #             still exclude. One warning per run when this is active.
  ae_contingency_combination: standard

  # Whether PST tap positions are treated as discrete integers
  # (recommended: true) or continuous values (false). The continuous
  # option has not been properly developed or tested in this project —
  # leave this at true unless you are specifically working on that.
  pst_taping_discrete: true

  # Whether the remedial-action count limit (see ra_limits below) is a
  # hard constraint (true — the model refuses to exceed it) or a soft one
  # (false — exceeding it is allowed but penalized via ra_limit_penalty).
  ra_limit_constraint_hard: true

  # Whether a base-case (N-0) overload on a scanned (monitored-only, not
  # fully secured) element is a hard constraint or a soft one.
  #
  # IMPORTANT — this is the ONLY overload-related constraint anywhere in
  # the whole MILP that has a hard mode at all; every other overload type
  # (regular N-0, N-X PATL, N-X TATL, N-X scanned) is unconditionally
  # soft, with no toggle. When this is true (the current default,
  # matching what's always been hardcoded), a scanned element that is
  # already overloaded before any remedial action, with no available PST
  # or RD action able to bring it back under its limit, can make the
  # ENTIRE solve infeasible — not just fail to fix that one element, but
  # break the whole run. Setting this to false creates a slack variable
  # instead (penalized via scanned_element_penalty_eur_per_ka below),
  # allowing the overload to exist at a real cost rather than blocking
  # the solve outright.
  scanned_element_constraint_hard: true

thresholds:
  # N-0: minimum branch loading (%) for a branch to be considered in the
  # model at all. 0.0 means every monitored branch is included regardless
  # of how lightly loaded it is.
  min_loading_threshold_pct: 0.0

  # Same idea as min_loading_threshold_pct above, but applied separately
  # during N-X (post-contingency) analysis. A branch can be lightly
  # loaded in the normal case but much more heavily loaded under a
  # specific contingency (or vice versa) — so this filter is checked
  # using each branch's post-contingency loading, not its base-case
  # loading, and can end up including or excluding a different set of
  # branches than the N-0 filter does.
  min_loading_threshold_pct_nx: 0.0

  # N-0: minimum PST sensitivity for a branch to be kept in scope for PST-related
  # constraints, in percent of the branch limit PER TAP (|A per degree| x |degrees per tap|,
  # the largest over the PSTs). 0.0 means nothing gets pruned by sensitivity.
  sensitivity_threshold_pct_pst: 0.0

  # N-0: same as above, for RD (redispatch) sensitivity.
  sensitivity_threshold_pct_rd: 0.0

  # N-X: same as sensitivity_threshold_pct_pst, but for post-contingency
  # analysis. An entry whose effect per tap (|A per degree| x |degrees per tap|)
  # is below this % of the branch limit (PATL; effective limit for a scanned branch) is dropped as each contingency is read, in
  # every calculation mode. 0.0 drops nothing; must be >= 0.
  sensitivity_threshold_pct_pst_nx: 0.0

  # N-X, redispatch AND countertrade (one key for both): an entry is dropped
  # when the effect of 100 MW (|A per MW| x 100) is below this % of the branch
  # limit (PATL; effective limit for a scanned branch), i.e. the unit is percent
  # of the limit PER 100 MW. It is applied as each contingency is read, in every
  # calculation mode, so the full table never exists in memory. A countertrade
  # unit is judged before its values are summed per RA and direction. 0.0 drops
  # nothing; must be >= 0.
  sensitivity_threshold_pct_rd_nx: 0.0

  # Convergence check of the linearisation loop. Every criterion below is an
  # INDEPENDENT acceptance criterion: the loop stops as soon as ANY ONE holds
  # (after the solution was applied and its load flow converged). Besides them:
  # max_linearisation_iterations (hard cap, below) and the cyclic-repetition exit
  # (see max_change_ra).
  #
  # Criteria 1+2 — sum of the remedial action change. Holds when BOTH
  #   sum over PSTs of |tap change|  < max_change_ra_sum_threshold   (taps, criterion 1)  AND
  #   sum over generating units of |delta target_p| < max_change_ra_sum_threshold  (MW)
  # of the latest solve (change against the state it was built on). The tap count and
  # the MW sum are compared against the SAME number, separately; spec eq. 3.35 instead
  # sums the RD MW and the PST flow shift (in MW) into one value. Not built.
  max_change_ra_sum_threshold: 1.0

  # Criterion 3 — each remedial action changes by less than this value:
  #   max over PSTs of |tap change| < max_change_ra  AND
  #   max over generating units of |delta target_p| < max_change_ra  (MW).
  # Also the tolerance of the cyclic-repetition exit: after iteration k >= 2 the
  # cumulative solution (tap per PST, net RD MW per generating unit) is compared with
  # the solutions after iterations 0..k-2 (0 = original network; k-1 is covered by the
  # change criteria); if the maximum absolute difference to one of them is below this
  # value the loop stops (status CYCLIC_REPETITION), keeping the last applied state.
  # Units as in criteria 1+2 (taps and MW against the same number). The spec gives no
  # numeric default; 1.0 is a starting value, not a spec-confirmed one.
  max_change_ra: 1.0

  # Criterion 4 — change of the element overloads, evaluated on the AC state:
  #   sum over the monitored elements e of | overload_e(k) - overload_e(k-1) |  <  this value
  # in AMPERE. overload_e(state) = max(0, I_e - limit_e). Elements = the N-0 branches of
  # the model (limit as in the model: PATL, or the effective limit of a scanned branch) and
  # the (branch, contingency) pairs of the model's N-X PATL and TATL constraints (limit as
  # in the respective constraint). I_e = AC current at the applied state; for the N-X pairs
  # plus the linearised effect of the curative actions of the solve (the quantity the N-X
  # constraints bound). State 0 = the initial AC state (no curative effect), so the
  # criterion is evaluable from iteration 1. It is summed per element (an element getting
  # worse and another getting better do not cancel). The model's own slack variables are
  # NOT used (they are 0 whenever the model believes the overload is solved). Not evaluated
  # (does not hold) when the N-X load flow of the applied state could not be computed.
  # The spec gives no numeric default; 1.0 A is a starting value.
  max_change_overload: 1.0

iteration_caps:
  # How many times the post-RA AC convergence loop is allowed to apply
  # PST results, re-run a real load flow, and re-solve — before giving up
  # even if the solution hasn't fully stabilized yet.
  max_linearisation_iterations: 10

  # How many times the post-RA N-X congestion-check loop is allowed to
  # re-solve after finding new contingency overloads the model didn't
  # originally account for — before giving up even if new overloads are
  # still being found.
  max_completeness_iterations: 5

  # NEW (found against real data): when the AC verification loop's own
  # direct, single-jump AC solve fails to converge after applying the
  # MILP's full proposed PST/RD change in one step, this is how many
  # intermediate steps the incremental fallback takes toward that same
  # final change instead — re-solving at each step, warm-started from
  # the previous step's own converged state (voltage_init_mode=
  # PREVIOUS_VALUES), rather than attempting the full jump from a flat
  # start in one shot. Confirmed directly on a real non-convergent case:
  # the direct jump failed even with warm-starting alone (no
  # intermediate steps) and even with intermediate steps alone (no
  # warm-starting) — only the combination of both converged, and did so
  # with as few as 2 steps in that specific case. 5 is a deliberately
  # modest, fixed default (not adaptive/escalating) — if this proves
  # insufficient on some future scenario, that will be visible directly
  # in the logs (which report exactly how many steps were needed and
  # whether they succeeded) rather than silently failing differently.
  incremental_ac_fallback_max_steps: 5

ra_limits:
  # Maximum number of remedial actions allowed per TSO.
  # This is a PER-TSO mapping, not a single number — e.g. to set a limit
  # for two specific TSOs while leaving every other TSO unconstrained:
  #   max_ra_count_per_timestamp_tso:
  #     TSO-Belgovia: 5
  #     TSO-Espheim: 3
  # null (the default) means no TSO has any limit at all.
  max_ra_count_per_timestamp_tso: null

  # HARD cap on the preventive PST tap changes
  # (sum of upward + downward steps) per TSO.
  max_taps_per_tso: 6

  # Optional per-TSO override of the limit above: {TSO name: limit}, TSO names
  # as in the logs and results_pst.csv (e.g. TSO-Espheim). A TSO not listed
  # uses max_taps_per_tso. Values must be non-negative integers.
  # Example:  max_taps_per_tso_overrides: {TSO-Espheim: 4}
  max_taps_per_tso_overrides: {}

  # Cost (EUR) per remedial action over the RA count limit above (relevant
  # only when a limit is actually configured, and only takes effect if
  # ra_limit_constraint_hard is false).
  ra_limit_penalty: 100.0

penalty_costs:
  # None of the 7 values below are finalized, real-world costs — every
  # one is a placeholder in the underlying code, carried over as-is here.
  # They exist so the MILP's objective function has SOME cost to weigh
  # tradeoffs against; the actual EUR values should not be treated as
  # meaningful until revisited.
  #
  # penalty_reference_pst_pra and penalty_reference_rd_pra specifically:
  # these are NOT overridden or made redundant by the per-remedial-action
  # penalty_factor already present in the NCP data (default 1.0 there).
  # The two combine — final cost = NCP's per-RA penalty_factor MULTIPLIED
  # BY the reference value configured here. This is the base EUR rate
  # that factor scales, not a value NCP data replaces.

  # Cost (EUR) per preventive PST tap change, before the NCP per-RA
  # penalty_factor multiplier is applied.
  penalty_reference_pst_pra: 100.0

  # Cost (EUR per MW) of preventive RD redispatch, before the NCP per-RA
  # penalty_factor multiplier is applied.
  penalty_reference_rd_pra: 100.0

  # Cost (EUR per MW) of an HVDC set-point change, preventive and curative, before the NCP per-RA
  # penalty_factor (missing = 1.0, with a warning) is applied. Read only when hvdc is in ra_types.
  # Factor 0 means free: the HVDC pair may then move anywhere inside its range, often to the edge of it.
  # Set a small penalty_factor above 0 in the NCP to limit the use. Preventive cost = factor x PRA reference x
  # |change|; curative cost = factor x CRA reference x the largest curative change over the contingencies.
  penalty_reference_hvdc_pra: 100.0
  penalty_reference_hvdc_cra: 100.0

  # Cost (EUR per MW) of countertrade, preventive and curative, before the NCP per-RA penalty_factor
  # (missing = 1.0) is applied. Read only when countertrade is in ra_types. The default is the RD preventive
  # reference. Preventive cost = factor x PRA reference x volume (plus the bid price and activation cost);
  # curative cost = factor x CRA reference x the largest curative volume over the contingencies (plus the
  # reservation price).
  penalty_reference_ct_pra: 100.0
  penalty_reference_ct_cra: 100.0

  # Cost (EUR per Ampere) of a base-case (N-0) overload — the regular,
  # non-scanned overload penalty. This one is always soft (no hard/
  # infeasibility-risk mode exists for it, unlike the scanned-element
  # case above).
  penalty_cost_overload_n0: 10000.0

  # Cost (EUR per Ampere) of a permanent (PATL) overload under a
  # contingency, in N-X analysis. Always soft.
  penalty_cost_overload_nx_patl: 10000.0

  # Cost (EUR per Ampere) of a temporary (TATL) overload under a
  # contingency, in N-X analysis. Deliberately set higher than the PATL
  # cost above — a temporary overload should be a last resort compared to
  # a permanent one. Always soft.
  penalty_cost_overload_nx_tatl: 100000.0

  # Cost (EUR per Ampere) of an overload on a scanned (monitored-only,
  # not fully secured) element, in N-X analysis. Unlike the N-0 scanned
  # case above (scanned_element_constraint_hard), this N-X version is
  # ALWAYS soft — no hard/infeasibility-risk mode exists for it.
  penalty_cost_overload_nx_scanned: 10000.0

  # Cost (EUR per kA) of a base-case (N-0) scanned-element overload, used
  # ONLY when scanned_element_constraint_hard above is false (when it's
  # true, this value is never used, since there is no slack variable to
  # penalize — the constraint is enforced strictly instead). Note the
  # unit here is kA, not A like every other penalty above — this one
  # genuinely uses a different unit in the underlying code.
  scanned_element_penalty_eur_per_ka: 0.0

# Power bids (redispatch and countertrade).
bids:
  # EUR per MWh. The price of a bid that has a volume but no price at the run
  # time (no price on its time point, or no time point there). 0.0 = free, as
  # before; a bid with a negative price is still set to 0. One warning per file
  # gives the count, the price used and the first 5 ids. Must be a number >= 0.
  default_price_eur_per_mwh: 0.0

# Lead time of the bids (redispatch and countertrade, preventive and curative).
lead_time:
  # Hours between the decision point and the run time (the hour before the run
  # by default; the decision point may fall on the previous day). A bid is
  # usable when its lead time is SHORTER than this distance (strict: a lead time
  # that ends exactly at the run time blocks the bid); a blocked bid has its
  # volume bounds fixed to 0. One summary line per run gives the decision point
  # and the blocked bids. Must be a number >= 0.
  decision_point_hours_before_run: 1.0

# N-X sensitivity analyses (PST, redispatch, countertrade units, HVDC).
nx_sensitivity:
  # Contingencies per pypowsybl analysis. pypowsybl keeps the result of every
  # contingency of an analysis until it is released: with a batch the result is
  # read, filtered and released before the next analysis starts, which lowers
  # the peak memory of a run with many contingencies. The result is the one of
  # a single analysis (same parameters, same contingencies, same tables, guard
  # and log totals); a batch costs one more base-case solve. A value at or above
  # the number of contingencies = one analysis. Must be an integer >= 1.
  contingency_batch_size: 200

# Curative remedial-action options.
curative_ra:
  # What happens to a curative PST group when one of its
  # members is itself an outage element of a contingency.
  #   blockedGroup (default, conservative): the whole group is unavailable as
  #                curative RA for that contingency.
  #   reducedGroup: the remaining PSTs still operate as a group (equal delta tap).
  # PSTGroupKind is not read from any NCP dataset, so this value applies to
  # every curative PST group unless overridden per TSO below.
  pst_group_kind_default: blockedGroup

  # Optional per-TSO override of the default above (PSTGroupKind is a per-TSO
  # RAO control parameter). Keys are TSO names as they appear in the logs and results_pst.csv (e.g. TSO-Belgovia)
  # (the PST's tso), values are blockedGroup or reducedGroup. {} = no override.
  # Example:  pst_group_kind_per_tso: {TSO-Belgovia: reducedGroup}
  pst_group_kind_per_tso: {}

  # TATL duration (seconds, integer >= 1) of a secured branch without a TATL in the CGM.
  # Curative reaction times (PST and RD timeToImplement) are compared with it, and it caps
  # the curative PST taps. Such a branch gets no TATL constraint (its TATL is its PATL).
  tatl_fallback_duration_s: 600

logging_options:
  # False (default, "normal mode"): suppresses HiGHS's own verbose
  # per-solve trace (presolve steps, coefficient ranges, node-by-node
  # branch-and-bound table) and per-iteration file-write confirmations,
  # and logs otherwise-static per-iteration lines (RD curative-bid
  # split, N-X constraint pair count) only once, repeating them only if
  # the value actually changes between iterations — while keeping the
  # one-line-per-iteration AC/completeness-loop summary and every
  # WARNING always visible. True ("debug mode"): shows all of the above
  # in full, every iteration, in addition to the same summary lines.
  # Neither mode ever hides a WARNING — this only controls INFO-level
  # verbosity.
  debug_log_mode: false

performance:
  # OpenLoadFlow threadCount of every security and sensitivity analysis (integer >= 1).
  # 1 = one thread (the provider default, nothing is passed).
  lf_thread_count: 1
  # HiGHS time limit per MILP solve in seconds (number > 0); null = no limit. A solve that
  # stops at the limit is not optimal: the run ends as SOLVER_NON_OPTIMAL.
  solver_time_limit_seconds: null
  # HiGHS relative MIP gap (number >= 0); null = the solver default.
  solver_mip_rel_gap: null

nx_constraint_filter:
  # true: an N-X flow row (PATL, TATL, scanned) that can never bind is not built, with its slack variable. A row can
  # never bind when |current| + sum |sensitivity| x (largest change the variable bounds allow) is at most
  # limit - margin_ampere; a variable without a finite bound keeps the row. The solution is the same; false builds
  # every row (to compare runs).
  enabled: true
  # Safety margin in ampere (number >= 0) kept between that bound and the limit.
  margin_ampere: 1.0

sensitivity_guard:
  # The guard compares the reference current of each sensitivity analysis with the load-flow current of the same state.
  # A pair is left out (a warning counts it) only when the relative gap exceeds the tolerance (1 %, DC 5 %) AND the
  # absolute gap exceeds this value in ampere (number >= 0). The two analyses distribute the post-contingency imbalance
  # slightly differently, a few ampere on lightly loaded branches.
  absolute_floor_ampere: 5.0
  # The run stops when more than this share (0 to 1) of all monitored (branch, contingency) pairs was left out by the guard,
  # or when no valid N-X data is left.
  max_dropped_share: 0.01

outputs:
  # true: sensitivity_pst_nx.csv and sensitivity_rd_nx.csv are written (one row per
  # contingency, branch and remedial action: tens of GB on a real-size network, so off by default).
  write_nx_sensitivity_csvs: false

# calculation_mode dc only (ignored by the AC modes).
dc_mode:
  # Correction factor f of the DC currents by nominal voltage (kV). The DC load flow, security
  # analysis and sensitivities give active power; the current of a branch side is
  #   I = f * |P| * 1000 / (sqrt(3) * V_nom,side * pf)
  # with pf = dc_power_factor of load_flow_config.yaml. The same factor converts flows and
  # sensitivities. "default" is required and applies to every nominal voltage without an entry;
  # add entries as  400: 1.1  (nominal voltage in kV, factor > 0). DC underestimates currents on
  # branches with high reactive flow: a factor above 1 compensates; the final AC check shows what
  # the DC optimisation missed.
  current_factor_by_nominal_voltage_kv:
    default: 1.0
